<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafayate</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    
    <!-- Archivo CSS externo -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header class="container mt-4">
        <h1 class="text-center">Estancias de Cafayate</h1>
    </header>

    <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
            <div class="carousel-item active" id="Paisaje1">
                <img src="https://lec.com.ar/wp-content/uploads/2021/01/timthumb-36.jpg" class="d-block w-100" alt="Paisaje 1">
            </div> 

            <div class="carousel-item" id="Paisaje2">
                <img src="https://canchas.we.golf/uploads/courses/Golf_in_Argentina_Estancias_Cafayate_Salta__02.jpg" class="d-block w-100" alt="Paisaje 2">
            </div>
    
            <div class="carousel-item" id="Paisaje3">
                <img src="https://www.1golf.eu/images/golfclubs/estancias-cafayate-golf_095367_1280-1280-70-0-0-0.jpg?v=43c7e402" class="d-block w-100" alt="Paisaje3">
            </div> 
        </div>

        <div class="carousel-controls">
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

    <main>
        <p>LA ESTANCIA DE CAFAYATE ES UN LUGAR EXCEPCIONAL. Es una forma de ser y vivir arraigado entre los placeres del vino, los caballos, la cultura del lugar y lo mejor en recreación y relajación.</p>
    </main>

    <footer>
        <a href="https://lec.com.ar/">Para más información accede aquí</a>
    </footer>

</body>
</html>
